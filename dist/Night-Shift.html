NS.World=class{

 if(tab==='Tarefas'){c.innerHTML=`<p>${g.tasks.done.length}/5 concluídas · ${g.night.clock()} · Noite ${g.currentNight}</p>`+g.tasks.order.map(id=>`<div class="task ${g.tasks.isDone(id)?'done':''}">${g.tasks.isDone(id)?'✓':'□'} ${g.tasks.catalog[id].name}<small>${g.tasks.catalog[id].hint}</small></div>`).join('');}
 if(tab==='Mensagens'){c.innerHTML=g.messages.map(m=>`<div class="note"><span class="fine">GERENTE · ${NS.escape(m.time)}</span><br>${NS.escape(m.text)}</div>`).join('');}
 if(tab==='Câmeras'){this.cameraOpen=true;c.innerHTML=`<div class="row"><span id="camName">${g.cameras.views[g.cameras.index].name}</span><span class="fine">AO VIVO</span></div><div class="cam"><canvas id="feed"></canvas></div><div id="camButtons" class="tabs"></div><p class="fine">Câmeras indisponíveis quando a energia falha. Nem toda presença é visível fora do CFTV.</p>`;for(let i=0;i<5;i++)this.appendButton(c.querySelector('#camButtons'),'0'+(i+1),()=>{g.cameras.index=i;g.cameras.timer=0;this.phone('Câmeras');},i===g.cameras.index?'selected':'');g.cameras.timer=0;}
 if(tab==='Relatório'){c.innerHTML=`<p>Registre algo que você observou recentemente. Selecione a categoria e o local corretos.</p><label class="row">Categoria<select id="category">${['objeto','pessoa','iluminação','porta','câmera','som','outra'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="row">Local<select id="zone">${['Corredores','Depósito','Escritório','Caixa','Funcionários','Fundos'].map(x=>`<option>${x}</option>`).join('')}</select></label><div id="reportButton"></div><p class="fine">Confirmadas: ${g.anomalies.correct} · Registros: ${g.anomalies.reports}</p>`;this.appendButton(c.querySelector('#reportButton'),'Enviar ocorrência',()=>{g.anomalies.report(c.querySelector('#category').value,c.querySelector('#zone').value);this.phone('Relatório');},'primary');}
 }
 inventory(){const g=this.g,p=this.show(`<div class="eyebrow">Equipamento pessoal</div><h2>Mochila — 6 espaços</h2><p>Bateria da lanterna: ${Math.round(g.inventory.battery)}%</p><div id="slots" class="grid"></div><p class="fine">Chave, cartão, ferramentas e fusível são utilizados automaticamente. Toque numa bateria para substituir.</p><div id="bagBack"></div>`),slots=p.querySelector('#slots');for(let i=0;i<6;i++){const item=g.inventory.items[i],d=document.createElement('div');d.className='item';d.textContent=item||'Vazio';if(item){const b=this.button(item==='bateria'?'Usar':'Inspecionar',()=>{g.inventory.use(item);this.inventory();});b.style.minHeight='36px';b.style.padding='6px 10px';d.append(b);}slots.append(d);}this.appendButton(p.querySelector('#bagBack'),'Fechar',()=>this.close());}
 breaker(){const g=this.g,p=this.show(`<div class="eyebrow">Manutenção / energia</div><h2>Quadro elétrico</h2><div class="note">Etiqueta: I / O / I<br>Ordem correta: ligado · desligado · ligado</div><div id="switches" class="tabs"></div><div id="powerButtons" class="grid"></div><p class="fine">${g.difficulty==='Pesadelo'?'Pesadelo: precisa de um fusível. Está no banheiro.':'Ferramentas já estão na mochila.'}</p>`);for(let i=0;i<3;i++)this.appendButton(p.querySelector('#switches'),`${i+1}: ${g.power.switches[i]?'I':'O'}`,()=>{g.power.toggle(i);this.breaker();},'switch');this.appendButton(p.querySelector('#powerButtons'),'Religar',()=>{if(g.power.repair())this.close();},'primary');this.appendButton(p.querySelector('#powerButtons'),'Fechar',()=>this.close());}
 document(){const p=this.show(`<div class="eyebrow">Documento 01 / ocorrências</div><h2>Não era um cliente</h2><div class="note clue">“O homem do estacionamento apareceu nas cinco câmeras ao mesmo tempo. O gerente mandou apagar as fitas. No recibo havia outro endereço: o posto da estrada. Data: amanhã.”</div><p>Pista registrada no final do turno. Há uma conexão que ainda não pode ser investigada nesta versão.</p><div id="docBack"></div>`);this.appendButton(p.querySelector('#docBack'),'Guardar registro',()=>this.close(),'primary');}
 credits(){const p=this.show(`<div class="eyebrow">Night Shift / versão 0.1</div><h2>Como sobreviver</h2><p>Joystick à esquerda: caminhar. Arraste no cenário: olhar. CORRER: mantenha pressionado. USAR: interagir com o objeto à frente. LUZ: ligar a lanterna. CELULAR: tarefas, mensagens, câmeras e relatório.</p><p>Complete as cinco tarefas e chegue às 06:00. O armário na sala dos funcionários é um esconderijo. Durante a caça, apague a lanterna e se esconda, ou fique imóvel por cinco segundos a mais de dois metros da presença.</p><p class="fine">PC: WASD · arrastar o mouse para olhar · E usar · F luz · P celular · I mochila · Shift correr · Esc pausa.</p><p class="fine">Código, geometria e sons procedurais originais. Sem bibliotecas externas, imagens de terceiros, publicidade ou serviços online. Desenvolvido para Toast.</p><div id="creditsBack"></div>`);this.appendButton(p.querySelector('#creditsBack'),'Voltar',()=>this.menu());}
 shop(){const g=this.g,s=g.save.data,p=this.show(`<div class="eyebrow">Pagamento / melhorias</div><h2>Armário pessoal</h2><div class="stat">R$ ${s.money}</div><div id="shopItems"></div><p class="fine">Bateria ampliada: +15% ao começar um turno. Crachá: cosmético. Nenhuma compra usa dinheiro real.</p><div id="shopBack"></div>`);for(const [id,name,cost] of [['battery','Bateria ampliada',150],['badge','Crachá veterano',90]]){const d=document.createElement('div');d.className='shop';d.textContent=name+' · R$ '+cost;const b=this.button(s.cosmetics.includes(id)?'Adquirido':'Comprar',()=>{if(s.money<cost){this.toast('Saldo insuficiente.');return;}s.money-=cost;s.cosmetics.push(id);g.save.write();this.shop();});b.disabled=s.cosmetics.includes(id);d.append(b);p.querySelector('#shopItems').append(d);}this.appendButton(p.querySelector('#shopBack'),'Voltar',()=>this.menu());}
 results(r){document.getElementById('hud').classList.add('hidden');const won=r.outcome==='won',p=this.show(`<div class="eyebrow">${won?'O sol voltou a nascer':'Registro encerrado'}</div><h2>${won?'TURNO CONCLUÍDO':r.outcome==='lost'?'TURNO INTERROMPIDO':'TAREFAS PENDENTES'}</h2><p>${won?'Você deixou as chaves no balcão. Amanhã há outro turno.':r.outcome==='lost'?'Uma presença alcançou você. Não houve violência gráfica.':'Chegou às 06:00, mas não concluiu todas as tarefas.'}</p><div class="row">Tempo sobrevivido <span class="stat">${r.time}</span></div><div class="row">Tarefas <span>${r.tasks}/5</span></div><div class="row">Anomalias observadas <span>${r.found}</span></div><div class="row">Relatórios confirmados <span>${r.correct}</span></div><div class="row">Pagamento <span class="stat">R$ ${r.pay}</span></div><div class="row">Experiência <span>+${r.xp} XP</span></div>${r.ending?`<div class="note">${r.ending}</div>`:''}<div id="resultButtons" class="grid"></div>`);this.appendButton(p.querySelector('#resultButtons'),won?'Próxima noite':'Tentar novamente',()=>this.g.start(null),'primary');this.appendButton(p.querySelector('#resultButtons'),'Menu',()=>this.menu());}
 update(dt){if(this.toastTime>0){this.toastTime-=dt;if(this.toastTime<=0)document.getElementById('toast').style.opacity=0;}this.hudTime-=dt;if(this.hudTime>0||this.g.mode!=='playing')return;this.hudTime=.15;const g=this.g;document.getElementById('clock').textContent=g.night.clock();document.getElementById('status').textContent=`NOITE ${g.currentNight} · ${g.tasks.done.length}/5 TAREFAS${!g.power.on?' · SEM ENERGIA':''}${g.save.data.cosmetics.includes('badge')?' · VETERANO':''}`;document.getElementById('prompt').textContent=g.player.hidden?'Escondido · USAR para sair':g.interaction.work?`Trabalhando ${Math.ceil((1-g.interaction.work.left/g.interaction.work.total)*100)}%`:g.interaction.target?'USAR · '+g.interaction.target.name:'';document.getElementById('meters').textContent=`LUZ ${Math.round(g.inventory.battery)}% · FÔLEGO ${Math.round(g.player.stamina)}%`;document.getElementById('flash').classList.toggle('selected',g.player.flashlight);}
};
NS.GameManager=class{
 constructor(options={}){
 this.mode='menu';this.seed=Date.now()>>>0;this.currentNight=1;this.difficulty='Normal';this.random=NS.rng(this.seed);this.bus=new NS.EventBus();this.save=new NS.SaveSystem(options.storage);this.renderer=options.renderer||new NS.Renderer(document.getElementById('world'));this.world=new NS.World();this.ui=new NS.UIManager(this);this.audio=new NS.AudioManager(this);this.controls=new NS.TouchControls(this);this.resetSystems();this.renderer.uploadWorld(this.world);this.ui.applySettings();this.ui.menu();this.last=0;this.renderTime=0;this.checkpointTime=15;this.messages=[];this.clueFound=false;
 this.bus.on('hour',h=>this.onHour(h));this.bus.on('task',id=>{if(id==='box'&&this.currentNight>=2)this.message('Você abriu o depósito? As gravações mostram mais alguém.');});window.addEventListener('renderer-lost',()=>{this.pause();this.ui.toast('O vídeo foi interrompido. Reabra o jogo para restaurar o turno salvo.');});window.addEventListener('pagehide',()=>this.save.checkpoint(this));if(!options.manual)requestAnimationFrame(t=>this.frame(t));
 }
 resetSystems(){this.player=new NS.PlayerController(this);this.inventory=new NS.InventorySystem(this);this.night=new NS.NightManager(this);this.tasks=new NS.TaskManager(this);this.power=new NS.PowerSystem(this);this.anomalies=new NS.AnomalyManager(this);this.entity=new NS.EntityAI(this);this.interaction=new NS.InteractionSystem(this);this.cameras=new NS.CameraSystem(this);}
 start(snapshot=null){this.audio.unlock();this.seed=snapshot?.seed??((Date.now()+Math.floor(Math.random()*10000))>>>0);this.random=NS.rng(this.seed);this.currentNight=snapshot?.night||this.save.data.night;this.difficulty=snapshot?.difficulty||this.save.data.settings.difficulty;this.world=new NS.World(this.seed);this.resetSystems();this.messages=[{time:'00:00',text:'Boa noite. Confira a lista e termine às seis. O depósito fica nos fundos. O terminal das câmeras está no escritório.'},{time:'Manual',text:'Se ele se aproximar em silêncio, observe a distância. Durante uma caça, apague a lanterna. Armário na sala dos funcionários. Não existe tarefa que exija tocar na presença.'}];this.clueFound=false;
 if(this.save.data.cosmetics.includes('battery'))this.inventory.battery+=15;
 if(snapshot){this.night.elapsed=NS.clamp(snapshot.elapsed||0,0,this.night.duration);this.night.hour=this.night.elapsed/this.night.duration*6;this.night.lastHour=Math.floor(this.night.hour);this.tasks.done=(snapshot.tasks||[]).filter(id=>this.tasks.catalog[id]);Object.assign(this.inventory,snapshot.inventory||{});Object.assign(this.player,snapshot.player||{});Object.assign(this.power,snapshot.power||{});Object.assign(this.anomalies,snapshot.anomalies||{});Object.assign(this.entity,snapshot.entity||{});for(const d of snapshot.doors||[]){const door=this.world.get(d.id);if(door){Object.assign(door,d);door.angle=door.open?1.45:0;}}for(const o of snapshot.objects||[]){const obj=this.world.get(o.id);if(obj)obj.active=o.active;}this.messages=snapshot.messages||this.messages;this.clueFound=!!snapshot.clue;this.world.get('odd').active=this.anomalies.active.some(a=>a.id==='moved');this.world.get('customer').active=this.anomalies.active.some(a=>a.id==='staring'||a.id==='vanish');}
 this.renderer.uploadWorld(this.world);this.ui.close();document.getElementById('hud').classList.remove('hidden');this.mode='playing';this.controls.clear();this.checkpointTime=15;this.save.checkpoint(this);this.ui.toast(snapshot?'Turno restaurado.':'00:00 — Abra o celular para consultar as tarefas.');
 try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
 }
 message(text){this.messages.push({time:this.night.clock(),text});this.ui.toast('Nova mensagem do gerente.');}
 onHour(h){if(this.mode!=='playing')return;if(h===1)this.message('Se notar algo diferente, registre a categoria e o local no relatório.');if(h===2)this.message('Você mexeu na câmera 4?');if(h===3)this.message('A energia costuma falhar. A etiqueta do quadro é I / O / I.');if(h===4)this.message('Não responda a quem chama pelo seu nome nos fundos.');if(h===5)this.message('Falta uma hora. Termine as tarefas e evite permanecer nas câmeras.');}
 pause(){if(this.mode!=='playing')return;this.save.checkpoint(this);this.mode='paused';this.controls.clear();this.ui.pause();}
 resume(){this.mode='playing';this.audio.unlock();this.ui.close();document.getElementById('hud').classList.remove('hidden');}
 tick(dt){dt=NS.clamp(dt,0,.1);if(this.mode==='playing'){if(!this.ui.overlay)this.player.update(dt);else this.player.moving=0;this.world.update(dt);this.interaction.update(dt);this.inventory.update(dt);this.power.update(dt);this.anomalies.update(dt);this.entity.update(dt);if(this.mode==='playing')this.night.update(dt);this.checkpointTime-=dt;if(this.checkpointTime<=0){this.checkpointTime=15;this.save.checkpoint(this);}this.cameras.update(dt);}this.ui.update(dt);this.audio.update();}
 frame(t){const dt=this.last?Math.min(.1,(t-this.last)/1000):0;this.last=t;this.tick(dt);this.renderTime+=dt;if(this.renderTime>=1/this.save.data.settings.fps){this.renderTime=0;if(this.mode==='menu')this.renderer.draw(this,{x:7,y:1.9,z:-6,yaw:-2.45,pitch:0});else this.renderer.draw(this,this.player.view());}requestAnimationFrame(tt=>this.frame(tt));}
 finish(outcome){if(this.mode!=='playing')return;this.mode='results';this.controls.clear();this.ui.cameraOpen=false;const s=this.save.data,won=outcome==='won',pay=won?65+this.tasks.done.length*10+this.anomalies.correct*12:0,xp=won?75+this.anomalies.correct*15:10;let ending='';if(won){s.completed++;s.night=Math.max(s.night,this.currentNight+1);if(this.clueFound&&!s.clues.includes('registro-01'))s.clues.push('registro-01');if(this.currentNight>=5){const id=s.clues.length&&this.anomalies.correct>=3?'secreto':this.anomalies.correct===0?'ruim':'normal';if(!s.endings.includes(id))s.endings.push(id);ending={normal:'Final normal: o contrato foi renovado. A presença continua lá.',secreto:'Final secreto: o recibo de amanhã indica o posto da estrada.',ruim:'Final ruim: você assinou o relatório em branco. Seu nome apareceu na escala antiga.'}[id];}}
 s.money+=pay;s.xp+=xp;s.active=null;this.save.write();this.ui.results({outcome,time:this.night.clock(),tasks:this.tasks.done.length,found:this.anomalies.found,correct:this.anomalies.correct,pay,xp,ending});}
};
if(!window.NIGHT_SHIFT_TEST){try{window.game=new NS.GameManager();}catch(e){document.getElementById('screen').innerHTML=`<div class="panel"><h2>Não foi possível iniciar</h2><p>${NS.escape(e.message)}</p><button onclick="location.reload()">Tentar novamente</button></div>`;console.error(e);}}
</script>
