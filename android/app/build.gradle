plugins { id 'com.android.application' }
android {
    namespace 'com.nightshift.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nightshift.game'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Java-only app: universal APK works on ARM64 without native dependencies.
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
